<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- CSP ajustada para DEV (Vite + Workers + blobs) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';

        script-src
          'self'
          'unsafe-inline'
          'unsafe-eval'
          blob:
          http://localhost:5173
          ws://localhost:5173
          https://www.googletagmanager.com;

        worker-src
          'self'
          blob:
          http://localhost:5173;

        style-src 'self' 'unsafe-inline';

        img-src 'self' data: blob: https: http://localhost:5173;

        font-src 'self' data:;

        connect-src
          'self'
          http://localhost:3000
          ws://localhost:3000
          http://localhost:5173
          ws://localhost:5173
          https://*.supabase.co
          https://www.google-analytics.com;

        base-uri 'self';
      "
    />

    <link
      rel="icon"
      type="image/png"
      href="https://horizons-cdn.hostinger.com/b643c455-4dba-4a09-b9e7-84de446a2668/8d59e3ef48052662cbf791dd63b9ba04.png"
    />

    <meta name="generator" content="Hostinger Horizons" />

    <title>CotaFacil</title>
  </head>
